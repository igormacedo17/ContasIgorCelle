<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contas a Dois</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  :root {
    --ink: #1C2B33;
    --paper: #EEF0EB;
    --card: #F8F7F2;
    --teal: #2F6F63;
    --gold: #B8901F;
    --rust: #A8503A;
    --muted: #5B6763;
    --line: #E3E4DB;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    background-image: radial-gradient(circle at 1px 1px, rgba(28,43,51,0.05) 1px, transparent 0);
    background-size: 15px 15px;
    color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .font-display { font-family: 'Fraunces', Georgia, serif; }
  .font-mono { font-family: 'IBM Plex Mono', 'Courier New', monospace; font-variant-numeric: tabular-nums; font-feature-settings: 'tnum' 1; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, select { font-family: inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

  #app { max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: 88px; }

  header.app-header { background: linear-gradient(160deg, #223540 0%, var(--ink) 60%); padding: 20px 16px 16px; position: sticky; top: 0; z-index: 20; }
  .header-top { display: flex; align-items: center; justify-content: space-between; }
  .header-top h1 { font-size: 22px; margin: 0; color: var(--paper); }
  .icon-btn { color: #C7CFC9; padding: 4px; transition: color 0.15s ease, transform 0.15s ease; }
  .icon-btn:hover { color: #fff; }
  .month-nav { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; }
  .month-nav span { font-size: 13px; letter-spacing: 0.03em; color: #C7CFC9; }
  .save-note { font-size: 11px; text-align: center; margin-top: 8px; color: #9AA79F; }

  main { padding: 16px; }
  .stack { display: flex; flex-direction: column; gap: 20px; }
  .dash-grid { display: flex; flex-direction: column; gap: 20px; }
  .dash-col { display: flex; flex-direction: column; gap: 20px; }
  .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; margin: 0 0 10px; padding-left: 10px; border-left: 2px solid var(--teal); }

  .card { background: var(--card); border-radius: 14px; padding: 16px; border: 1px solid rgba(28,43,51,0.06); box-shadow: 0 1px 2px rgba(28,43,51,0.03), 0 6px 16px rgba(28,43,51,0.04); }
  .card.tight { padding: 14px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .summary-label { font-size: 12px; color: var(--muted); margin: 6px 0 2px; }
  .summary-value { font-size: 18px; margin: 0; }
  .summary-sub { font-size: 10px; color: var(--muted); margin: 2px 0 0; }
  .big-value { font-size: 24px; margin: 2px 0 0; }
  .small-note { font-size: 12px; color: var(--muted); margin: 4px 0 0; }

  .proj-row { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--line); }
  .proj-row:first-child { border-top: none; }
  .proj-row-v2 { padding: 10px 16px; border-top: 1px solid var(--line); }
  .proj-row-v2:first-child { border-top: none; }
  .proj-month { font-size: 11px; color: var(--muted); width: 48px; flex-shrink: 0; }
  .proj-bar-bg { flex: 1; height: 8px; border-radius: 999px; background: var(--line); }
  .proj-bar-fill { height: 8px; border-radius: 999px; }
  .proj-pct { font-size: 11px; width: 48px; text-align: right; flex-shrink: 0; }

  .pill-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill { padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 500; background: var(--card); color: var(--muted); border: 1px solid rgba(28,43,51,0.08); transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease; }
  .pill:hover { border-color: rgba(28,43,51,0.18); }
  .pill.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  .tx-row { background: var(--card); border-radius: 14px; padding: 14px; border: 1px solid rgba(28,43,51,0.06); box-shadow: 0 1px 2px rgba(28,43,51,0.03); }
  .tx-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .tx-title { font-size: 14px; font-weight: 500; margin: 0; }
  .tx-sub { font-size: 11px; color: var(--muted); margin: 2px 0 0; }
  .tx-amount-btn { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .tx-amount { font-size: 14px; }
  .tx-actions { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .status-btn { font-size: 11px; padding: 5px 10px; border-radius: 999px; font-weight: 500; border: 1px solid; transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease; }
  .status-btn.stamped {
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 700;
    border-style: double;
    border-width: 3px;
    transform: rotate(-2deg);
    box-shadow: 0 1px 0 rgba(28,43,51,0.06);
  }
  .empty-note { font-size: 14px; text-align: center; padding: 36px 16px; color: var(--muted); border: 1.5px dashed rgba(28,43,51,0.16); border-radius: 14px; background: rgba(255,255,255,0.3); }

  .field label { font-size: 12px; color: var(--muted); }
  .field { margin-bottom: 14px; }
  .field-input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #D8DAD2; font-size: 14px; margin-top: 4px; background: #fff; }
  .type-toggle { display: flex; border-radius: 14px; overflow: hidden; background: var(--card); margin-bottom: 16px; border: 1px solid rgba(28,43,51,0.06); }
  .type-toggle button { flex: 1; padding: 11px 0; font-size: 14px; font-weight: 500; color: var(--muted); transition: background 0.15s ease, color 0.15s ease; }
  .type-toggle button.active { background: var(--ink); color: var(--paper); }
  .primary-btn { width: 100%; padding: 13px 0; border-radius: 14px; font-size: 14px; font-weight: 600; color: #fff; background: var(--teal); margin-top: 6px; transition: filter 0.15s ease, transform 0.1s ease; }
  .primary-btn:hover:not(:disabled) { filter: brightness(1.08); }
  .primary-btn:active:not(:disabled) { transform: scale(0.98); }
  .primary-btn:disabled { opacity: 0.4; }
  .responsavel-row { display: flex; gap: 8px; flex-wrap: wrap; }

  .card-item { background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 10px; border: 1px solid rgba(28,43,51,0.06); box-shadow: 0 1px 2px rgba(28,43,51,0.03), 0 6px 16px rgba(28,43,51,0.04); }
  .card-item-top { display: flex; align-items: center; justify-content: space-between; }

  nav.tabbar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid #DEDFD6; z-index: 20; box-shadow: 0 -2px 12px rgba(28,43,51,0.05); }
  nav.tabbar .inner { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
  nav.tabbar button { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 0; color: var(--muted); }
  nav.tabbar button.active { color: var(--teal); }
  nav.tabbar .glyph { font-size: 18px; line-height: 1; }
  nav.tabbar .lbl { font-size: 10px; font-weight: 500; }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
  .modal-sheet { width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; background: var(--card); border-radius: 18px 18px 0 0; padding: 20px; }
  .modal-sheet h2 { font-size: 18px; margin: 0 0 4px; }
  .modal-sheet h3 { font-size: 13px; margin: 18px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .cat-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
  .cat-chip { display: flex; align-items: center; justify-content: space-between; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 13px; }
  .cat-add-row { display: flex; gap: 8px; margin-top: 6px; }
  .cat-add-row input { flex: 1; }
  .btn-secondary { padding: 10px 14px; border-radius: 10px; background: #E5E3D9; font-size: 13px; }
  .btn-primary-sm { padding: 10px 14px; border-radius: 10px; background: var(--teal); color: #fff; font-size: 13px; font-weight: 600; }
  .modal-footer { display: flex; gap: 8px; margin-top: 20px; }
  .modal-footer button { flex: 1; padding: 11px 0; border-radius: 12px; font-size: 14px; }
  .export-row { display: flex; gap: 8px; margin-top: 8px; }

  /* ---------------------------------------------------------------
     Desktop layout (tablet/computador)
  --------------------------------------------------------------- */
  @media (min-width: 860px) {
    body { padding-bottom: 0; }
    #app { max-width: 1040px; padding-bottom: 0; display: flex; flex-direction: column; min-height: 100vh; }
    header.app-header { order: 1; padding: 22px 32px 18px; position: static; }
    header.app-header .header-top h1 { font-size: 25px; }
    nav.tabbar {
      order: 2;
      position: static;
      border-top: none;
      border-bottom: 1px solid #DEDFD6;
      background: var(--card);
    }
    nav.tabbar .inner { max-width: 900px; grid-template-columns: repeat(5, minmax(120px, auto)); justify-content: center; }
    nav.tabbar button { flex-direction: row; gap: 8px; padding: 16px 22px; position: relative; }
    nav.tabbar button::after { content: ''; position: absolute; left: 16px; right: 16px; bottom: 0; height: 2px; background: var(--teal); opacity: 0; transform: scaleX(0.6); transition: opacity 0.15s ease, transform 0.15s ease; }
    nav.tabbar button.active::after { opacity: 1; transform: scaleX(1); }
    nav.tabbar .glyph { font-size: 16px; }
    nav.tabbar .lbl { font-size: 13px; }
    main { order: 3; max-width: 900px; margin: 0 auto; width: 100%; padding: 32px 24px 60px; }
    .stack:not(.wide) { max-width: 640px; margin: 0 auto; width: 100%; }
    .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; align-items: start; }
    .dash-col { display: flex; flex-direction: column; gap: 20px; }
    .modal-backdrop { align-items: center; }
    .modal-sheet { max-width: 440px; border-radius: 18px; max-height: 82vh; box-shadow: 0 20px 60px rgba(28,43,51,0.25); }
  }
  .export-row button { flex: 1; padding: 11px 0; border-radius: 12px; font-size: 13px; font-weight: 500; }
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="import-file-input" accept="application/json" style="display:none">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
/* ---------------------------------------------------------------
   Configuração da nuvem (Firebase)
   Cole aqui os 6 valores do "firebaseConfig" que aparecem quando
   você registra um app Web no seu projeto Firebase.
--------------------------------------------------------------- */
const firebaseConfig = {
  apiKey: "AIzaSyDMnXIzFvUHVBxDWme9XTRd5-nqeE_ocvE",
  authDomain: "contasigorcelle.firebaseapp.com",
  projectId: "contasigorcelle",
  storageBucket: "contasigorcelle.firebasestorage.app",
  messagingSenderId: "710559623006",
  appId: "1:710559623006:web:9575ff33f35354630191cf"
};
// Identificador fixo do "casal" dentro do banco de dados — já vem pronto, não precisa mexer.
const HOUSEHOLD_ID = "8643fc2e-2b15-486d-b15c-a7430ff15c7c";
const FIREBASE_CONFIGURED = firebaseConfig.apiKey.indexOf("COLE_AQUI") === -1;

/* ---------------------------------------------------------------
   Constants & helpers
--------------------------------------------------------------- */
const STORAGE_KEY = 'gastos-casal-data-v1';
const MONTH_NAMES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];


function monthKey(year, monthIdx){ return year + '-' + String(monthIdx + 1).padStart(2, '0'); }
function currentMonthKey(){ const d = new Date(); return monthKey(d.getFullYear(), d.getMonth()); }
function addMonths(mKey, n){
  const parts = mKey.split('-').map(Number);
  const d = new Date(parts[0], parts[1] - 1 + n, 1);
  return monthKey(d.getFullYear(), d.getMonth());
}
function monthLabel(mKey){ const p = mKey.split('-').map(Number); return MONTH_NAMES[p[1]-1] + ' ' + p[0]; }
function monthLabelShort(mKey){ const p = mKey.split('-').map(Number); return MONTH_NAMES[p[1]-1].slice(0,3) + '/' + String(p[0]).slice(2); }
function fmtBRL(v){ return (Number(v)||0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' }); }
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function sortCategories(arr){ return arr.slice().sort((a, b) => a.localeCompare(b, 'pt-BR', { sensitivity: 'base' })); }

function defaultData(){
  return {
    people: ["Você", "Esposa"],
    incomeCategories: sortCategories(["Salário", "Vale Refeição/Alimentação", "Freelance", "Transferência recebida", "Rendimentos", "Outros"]),
    expenseCategories: sortCategories(["Moradia", "Alimentação", "Transporte", "Saúde", "Lazer", "Educação", "Assinaturas", "Cartão de Crédito", "Outros"]),
    cards: [],
    transactions: []
  };
}

let db = null;
let settingsRef = null;
let cardsRef = null;
let txRef = null;
let saveOk = true;
const loadedFlags = { settings: false, cards: false, transactions: false };

function initFirebase(){
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  settingsRef = db.collection('households').doc(HOUSEHOLD_ID);
  cardsRef = settingsRef.collection('cards');
  txRef = settingsRef.collection('transactions');
}

function checkAllLoaded(){
  if (loadedFlags.settings && loadedFlags.cards && loadedFlags.transactions) state.loaded = true;
}

function markSyncError(e){
  console.error('Falha ao sincronizar com a nuvem', e);
  saveOk = false;
  render();
}

// Split an array of Firestore write operations into batches of at most 400
// (Firestore's hard limit is 500 per batch — we stay comfortably under it).
async function commitInChunks(ops){
  for (let i = 0; i < ops.length; i += 400) {
    const batch = db.batch();
    ops.slice(i, i + 400).forEach(op => op(batch));
    await batch.commit();
  }
}

function attachRealtimeListeners(){
  settingsRef.onSnapshot(
    async (snap) => {
      if (snap.exists) {
        const s = snap.data();
        const dd = defaultData();
        state.data.people = s.people || dd.people;
        state.data.incomeCategories = sortCategories(s.incomeCategories || dd.incomeCategories);
        state.data.expenseCategories = sortCategories(s.expenseCategories || dd.expenseCategories);
      } else {
        const dd = defaultData();
        state.data.people = dd.people;
        state.data.incomeCategories = dd.incomeCategories;
        state.data.expenseCategories = dd.expenseCategories;
        try { await settingsRef.set({ people: dd.people, incomeCategories: dd.incomeCategories, expenseCategories: dd.expenseCategories }); }
        catch (e) { console.error('Falha ao criar configurações iniciais', e); }
      }
      loadedFlags.settings = true;
      saveOk = true;
      checkAllLoaded();
      render();
    },
    (err) => { loadedFlags.settings = true; checkAllLoaded(); markSyncError(err); }
  );

  cardsRef.onSnapshot(
    (snap) => {
      state.data.cards = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
      loadedFlags.cards = true;
      saveOk = true;
      checkAllLoaded();
      render();
    },
    (err) => { loadedFlags.cards = true; checkAllLoaded(); markSyncError(err); }
  );

  txRef.onSnapshot(
    (snap) => {
      state.data.transactions = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
      loadedFlags.transactions = true;
      saveOk = true;
      checkAllLoaded();
      render();
    },
    (err) => { loadedFlags.transactions = true; checkAllLoaded(); markSyncError(err); }
  );
}

/* ---------------------------------------------------------------
   State
--------------------------------------------------------------- */
const state = {
  data: defaultData(),
  loaded: false,
  tab: 'dashboard',
  filter: 'all',
  lancamentosMonth: 'all',
  cartoesMonth: currentMonthKey(),
  editingTxId: null,
  settingsOpen: false,
  newTxType: 'income',
  newRepeatMode: 'unica',
  novaDraft: { categoria: null, mes: currentMonthKey(), descricao: '', valor: '', valorTotal: '', parcelas: '', paymentType: 'debito', cardId: null, person: null, recorrente: false },
  analiseFiltros: { monthStart: addMonths(currentMonthKey(), -5), monthEnd: currentMonthKey(), category: 'all', person: 'all', payment: 'all' },
  dashboardFilter: (function(){ try { return localStorage.getItem('painelFiltroPessoa') || 'all'; } catch (e) { return 'all'; } })(),
  deleteRecurringModal: null
};

function captureNovaDraft(){
  const d = state.novaDraft;
  const el = (id) => document.getElementById(id);
  if (el('nova-categoria')) d.categoria = el('nova-categoria').value;
  if (el('nova-mes')) d.mes = el('nova-mes').value;
  if (el('nova-descricao')) d.descricao = el('nova-descricao').value;
  if (el('nova-valor')) d.valor = el('nova-valor').value;
  if (el('nova-valor-total')) d.valorTotal = el('nova-valor-total').value;
  if (el('nova-parcelas')) d.parcelas = el('nova-parcelas').value;
  if (el('nova-pagamento')) d.paymentType = el('nova-pagamento').value;
  if (el('nova-cartao-id')) d.cardId = el('nova-cartao-id').value;
  if (el('nova-responsavel')) d.person = el('nova-responsavel').dataset.selected;
  if (el('nova-recorrente')) d.recorrente = el('nova-recorrente').checked;
}

function resetNovaDraft(){
  state.novaDraft = { categoria: null, mes: currentMonthKey(), descricao: '', valor: '', valorTotal: '', parcelas: '', paymentType: 'debito', cardId: null, person: null, recorrente: false };
}


/* ---------------------------------------------------------------
   Computation helpers
--------------------------------------------------------------- */
function sumFor(transactions, month, type, statusFilter){
  return transactions
    .filter(t => t.month === month && t.type === type && (!statusFilter || statusFilter.includes(t.status)))
    .reduce((a, t) => a + Number(t.amount || 0), 0);
}
function monthTotals(transactions, month){
  return {
    incomeAll: sumFor(transactions, month, 'income'),
    incomeConfirmed: sumFor(transactions, month, 'income', ['recebido']),
    expenseAll: sumFor(transactions, month, 'expense'),
    expensePaid: sumFor(transactions, month, 'expense', ['pago'])
  };
}
function pctColor(pct){
  if (pct <= 50) return 'var(--teal)';
  if (pct <= 80) return 'var(--gold)';
  return 'var(--rust)';
}
function paymentLabel(type, card){
  if (type === 'credito') return card ? ('Cartão ' + card.name) : 'Cartão de crédito';
  if (type === 'debito') return 'Débito';
  if (type === 'pix') return 'Pix';
  return 'Dinheiro';
}

/* ---------------------------------------------------------------
   Render: header
--------------------------------------------------------------- */
function renderHeader(){
  return `
    <header class="app-header">
      <div class="header-top">
        <h1 class="font-display">Contas a Dois</h1>
        <button class="icon-btn" data-action="open-settings" aria-label="Configurações">
          <span class="glyph">&#9881;</span>
        </button>
      </div>
      ${!saveOk ? '<p class="save-note" style="color:var(--rust)">Não foi possível sincronizar com a nuvem agora. Verifique sua conexão.</p>' : ''}
    </header>
  `;
}

/* ---------------------------------------------------------------
   Render: dashboard
--------------------------------------------------------------- */
function renderDashboard(){
  const d = state.data;
  if (state.dashboardFilter !== 'all' && !d.people.includes(state.dashboardFilter)) state.dashboardFilter = 'all';
  const tx = state.dashboardFilter === 'all' ? d.transactions : d.transactions.filter(t => t.person === state.dashboardFilter);
  const t = monthTotals(tx, currentMonthKey());
  const saldoRealizado = t.incomeConfirmed - t.expensePaid;
  const saldoPrevisto = t.incomeAll - t.expenseAll;

  const months = Array.from({length:12}, (_, i) => addMonths(currentMonthKey(), i));
  const projection = months.map(m => {
    const inc = sumFor(tx, m, 'income');
    const exp = sumFor(tx, m, 'expense');
    const pct = inc > 0 ? Math.round((exp/inc)*100) : (exp > 0 ? 999 : 0);
    return { m, inc, exp, pct, saldo: inc - exp };
  });

  return `
    <div class="stack wide">
      <div class="pill-row">
        <button class="pill ${state.dashboardFilter==='all'?'active':''}" data-action="set-dashboard-filter" data-filter="all">Todos</button>
        <button class="pill ${state.dashboardFilter===d.people[0]?'active':''}" data-action="set-dashboard-filter" data-filter="${esc(d.people[0])}">${esc(d.people[0])}</button>
        <button class="pill ${state.dashboardFilter===d.people[1]?'active':''}" data-action="set-dashboard-filter" data-filter="${esc(d.people[1])}">${esc(d.people[1])}</button>
      </div>
      <div class="dash-grid">
        <div class="dash-col">
          <section>
            <p class="eyebrow">Este mês</p>
            <div class="grid2">
              <div class="card tight">
                <span>&#8593;</span>
                <p class="summary-label">Receita confirmada</p>
                <p class="summary-value font-mono" style="color:var(--teal)">${fmtBRL(t.incomeConfirmed)}</p>
                <p class="summary-sub">de ${fmtBRL(t.incomeAll)} previsto</p>
              </div>
              <div class="card tight">
                <span>&#8595;</span>
                <p class="summary-label">Despesa paga</p>
                <p class="summary-value font-mono" style="color:var(--rust)">${fmtBRL(t.expensePaid)}</p>
                <p class="summary-sub">de ${fmtBRL(t.expenseAll)} previsto</p>
              </div>
            </div>
            <div class="card" style="margin-top:10px;">
              <p class="summary-label">Saldo realizado</p>

/* ---------------------------------------------------------------
   Render: lançamentos
--------------------------------------------------------------- */
function renderLancamentos(){
  const monthFilter = state.lancamentosMonth || 'all';
  const distinctMonths = Array.from(new Set(state.data.transactions.map(t => t.month))).sort().reverse();

  const items = state.data.transactions
    .filter(t => monthFilter === 'all' || t.month === monthFilter)
    .filter(t => state.filter === 'all' || t.type === state.filter)
    .sort((a, b) => (b.month === a.month ? (a.createdAt||0) - (b.createdAt||0) : a.month.localeCompare(b.month)));

  const groups = [];
  items.forEach(tx => {
    let g = groups[groups.length - 1];
    if (!g || g.month !== tx.month) { g = { month: tx.month, items: [] }; groups.push(g); }
    g.items.push(tx);
  });

  return `
    <div class="stack" style="gap:12px;">
      <div class="field">
        <label style="font-size:11px;color:var(--muted);">Mês</label>
        <select class="field-input" id="lanc-mes" onchange="onLancMonthChange()">
          <option value="all" ${monthFilter==='all'?'selected':''}>Todos os meses</option>
          ${distinctMonths.map(m => `<option value="${m}" ${monthFilter===m?'selected':''}>${esc(monthLabel(m))}</option>`).join('')}
        </select>
      </div>
      <div class="pill-row">
        <button class="pill ${state.filter==='all'?'active':''}" data-action="set-filter" data-filter="all">Todos</button>
        <button class="pill ${state.filter==='income'?'active':''}" data-action="set-filter" data-filter="income">Receitas</button>
        <button class="pill ${state.filter==='expense'?'active':''}" data-action="set-filter" data-filter="expense">Despesas</button>
      </div>
      ${items.length === 0 ? `<p class="empty-note">${monthFilter==='all' ? 'Nenhum lançamento ainda.' : 'Nada lançado em ' + esc(monthLabel(monthFilter)) + '.'}</p>` : ''}
      ${groups.map(g => `
        ${monthFilter==='all' ? `<p class="eyebrow" style="margin-top:6px;">${esc(monthLabel(g.month))}</p>` : ''}
        <div class="stack" style="gap:8px;">
          ${g.items.map(renderTxRow).join('')}
        </div>
      `).join('')}
    </div>
  `;
}

function onLancMonthChange(){
  state.lancamentosMonth = document.getElementById('lanc-mes').value;
  render();
}

function renderTxRow(tx){
  const isIncome = tx.type === 'income';
  const confirmedLabel = isIncome ? 'recebido' : 'pago';
  const deniedLabel = isIncome ? 'nao_recebido' : 'nao_pago';
  const isConfirmed = tx.status === confirmedLabel;
  const isDenied = tx.status === deniedLabel;
  const card = tx.cardId ? state.data.cards.find(c => c.id === tx.cardId) : null;
  const editing = state.editingTxId === tx.id;

  const subParts = [tx.person];
  if (!isIncome && tx.paymentType) subParts.push(paymentLabel(tx.paymentType, card));
  if (tx.recurring) subParts.push('recorrente');
  if (tx.installment) subParts.push('parcela ' + tx.installment.index + '/' + tx.installment.total);

  return `
    <div class="tx-row" data-tx-id="${tx.id}">
      <div class="tx-top">
        <div style="min-width:0;">
          <p class="tx-title">${esc(tx.category)}${tx.description ? ' · ' + esc(tx.description) : ''}</p>
          <p class="tx-sub">${esc(subParts.join(' · '))}</p>
        </div>
        ${editing ? `
          <div style="display:flex;align-items:center;gap:4px;flex-shrink:0;">
            <input type="number" class="field-input" style="width:84px;padding:6px 8px;margin:0;" id="edit-amount-input" value="${tx.amount}" autofocus>
            <button data-action="save-amount" data-tx-id="${tx.id}" aria-label="Salvar valor" style="color:var(--teal)">&#10003;</button>
            <button data-action="cancel-edit" aria-label="Cancelar" style="color:var(--muted)">&#10005;</button>
          </div>
        ` : `
          <button class="tx-amount-btn" data-action="edit-amount" data-tx-id="${tx.id}">
            <span class="tx-amount font-mono" style="color:${isIncome ? 'var(--teal)' : 'var(--rust)'}">${fmtBRL(tx.amount)}</span>
            <span style="font-size:11px;color:var(--muted)">&#9998;</span>
          </button>
        `}
      </div>
      <div class="tx-actions">
        <button class="status-btn ${isConfirmed?'stamped':''}" data-action="set-status" data-tx-id="${tx.id}" data-status="${confirmedLabel}"
          style="border-color:var(--teal); background:${isConfirmed?'var(--teal)':'transparent'}; color:${isConfirmed?'#fff':'var(--teal)'}">
          ${isIncome ? 'Recebido' : 'Pago'}
        </button>
        <button class="status-btn" data-action="set-status" data-tx-id="${tx.id}" data-status="${deniedLabel}"
          style="border-color:var(--rust); background:${isDenied?'var(--rust)':'transparent'}; color:${isDenied?'#fff':'var(--rust)'}">
          ${isIncome ? 'Não recebido' : 'Não pago'}
        </button>
        <button data-action="delete-tx" data-tx-id="${tx.id}" aria-label="Excluir" style="margin-left:auto;color:var(--muted)">&#128465;</button>
      </div>
      ${tx.installment && tx.installment.index < tx.installment.total ? `
        <button data-action="cancel-installments" data-tx-id="${tx.id}" style="font-size:11px;color:var(--muted);text-decoration:underline;margin-top:8px;">
          Quitei antecipado — cancelar parcelas restantes
        </button>
      ` : ''}
    </div>
  `;
}

function onParcelaPreviewChange(){
  const preview = document.getElementById('parcela-preview');
  if (!preview) return;
  const total = Number(document.getElementById('nova-valor-total').value);
  const n = Number(document.getElementById('nova-parcelas').value);
  if (!total || !n || n < 2) { preview.textContent = 'Informe o valor total e o número de parcelas.'; return; }
  const amounts = splitInstallments(total, n);
  const mesEl = document.getElementById('nova-mes');
  const mesRef = (mesEl && mesEl.value) || currentMonthKey();
  preview.textContent = n + 'x de ' + fmtBRL(amounts[0]) + (amounts[0] !== amounts[n-1] ? ' (última parcela: ' + fmtBRL(amounts[n-1]) + ')' : '') + ' — a partir de ' + monthLabel(mesRef) + '.';
}

function splitInstallments(total, n){
  const totalCents = Math.round(total * 100);
  const baseCents = Math.floor(totalCents / n);
  const remainderCents = totalCents - baseCents * n;
  const amounts = new Array(n).fill(baseCents / 100);
  amounts[n - 1] = (baseCents + remainderCents) / 100;
  return amounts;
}

function onPaymentTypeChange(){
  const val = document.getElementById('nova-pagamento').value;
  state.novaDraft.paymentType = val;
  const wrap = document.getElementById('nova-cartao-wrap');
  if (val !== 'credito') { wrap.innerHTML = ''; return; }
  const cards = state.data.cards;
  if (cards.length === 0) {
    wrap.innerHTML = '<p class="small-note" style="color:var(--rust)">Cadastre um cartão na aba Cartões primeiro.</p>';
  } else {
    const draftCardId = state.novaDraft.cardId;
    wrap.innerHTML = '<select class="field-input" id="nova-cartao-id" style="margin-top:8px;">' +
      cards.map(c => `<option value="${c.id}" ${c.id===draftCardId?'selected':''}>${esc(c.name)}</option>`).join('') + '</select>';
  }
}

/* ---------------------------------------------------------------
   Render: análises (filtros, indicadores e composição)
--------------------------------------------------------------- */
function countMonthsBetween(start, end){
  let n = 0, m = start;
  while (m <= end && n < 500) { n++; m = addMonths(m, 1); }
  return Math.max(n, 1);
}

function paymentMatchesFilter(t, filterVal){
  if (filterVal === 'all') return true;
  if (filterVal.indexOf('credito:') === 0) return t.paymentType === 'credito' && t.cardId === filterVal.slice(8);
  return t.paymentType === filterVal;
}

function breakdown(txs, keyFn){
  const map = {};
  txs.forEach(t => { const k = keyFn(t) || 'Sem categoria'; map[k] = (map[k] || 0) + Number(t.amount || 0); });
  return Object.entries(map).sort((a, b) => b[1] - a[1]);
}

function renderBreakdownCard(title, rows, total, color){
  if (rows.length === 0) {
    return `<section><p class="eyebrow">${esc(title)}</p><div class="card"><p class="empty-note" style="padding:20px 0;">Sem dados no período com esses filtros.</p></div></section>`;
  }
  return `
    <section>
      <p class="eyebrow">${esc(title)}</p>
      <div class="card" style="padding:0;overflow:hidden;">
        ${rows.map(([label, val]) => {
          const pct = total > 0 ? (val / total * 100) : 0;
          return `
            <div class="proj-row-v2">
              <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;">
                <span style="font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(label)}</span>
                <span class="font-mono" style="font-size:12px;color:${color};flex-shrink:0;">${fmtBRL(val)}</span>
              </div>
              <div class="proj-bar-bg" style="margin:6px 0;"><div class="proj-bar-fill" style="width:${pct}%;background:${color}"></div></div>
              <p style="font-size:11px;color:var(--muted);margin:0;">${pct.toFixed(0)}% do total</p>
            </div>
          `;
        }).join('')}
      </div>
    </section>
  `;
}

function renderAnalises(){
  const d = state.data;
  const f = state.analiseFiltros;
  const allCats = sortCategories(Array.from(new Set([...d.incomeCategories, ...d.expenseCategories])));

  const inRange = d.transactions.filter(t => t.month >= f.monthStart && t.month <= f.monthEnd);
  const filtered = inRange.filter(t =>
    (f.category === 'all' || t.category === f.category) &&
    (f.person === 'all' || t.person === f.person) &&
    (f.payment === 'all' || t.type === 'income' || paymentMatchesFilter(t, f.payment))
  );

  const incomeTx = filtered.filter(t => t.type === 'income');
  const expenseTx = filtered.filter(t => t.type === 'expense');
  const totalIncome = incomeTx.reduce((a, t) => a + Number(t.amount || 0), 0);
  const totalExpense = expenseTx.reduce((a, t) => a + Number(t.amount || 0), 0);
  const saldo = totalIncome - totalExpense;
  const poupanca = totalIncome > 0 ? Math.round((saldo / totalIncome) * 100) : null;
  const nMeses = countMonthsBetween(f.monthStart, f.monthEnd);

  const incomeByCategory = breakdown(incomeTx, t => t.category);
  const incomeByPerson = breakdown(incomeTx, t => t.person);
  const expenseByCategory = breakdown(expenseTx, t => t.category);
  const expenseByPerson = breakdown(expenseTx, t => t.person);
  const expenseByPayment = breakdown(expenseTx, t => paymentLabel(t.paymentType, t.cardId ? d.cards.find(c => c.id === t.cardId) : null));

  const topExpenseCat = expenseByCategory[0];
  const topIncomeCat = incomeByCategory[0];

  return `

        </div>
        <div>
          <label style="font-size:11px;color:var(--muted);">Categoria</label>
          <select class="field-input" id="an-categoria" onchange="onAnFilterChange()">
            <option value="all">Todas as categorias</option>
            ${allCats.map(c => `<option value="${esc(c)}" ${f.category===c?'selected':''}>${esc(c)}</option>`).join('')}
          </select>
        </div>
        <div>
          <label style="font-size:11px;color:var(--muted);">Pessoa</label>
          <select class="field-input" id="an-pessoa" onchange="onAnFilterChange()">
            <option value="all">Todos</option>
            ${[...d.people, 'Ambos'].map(p => `<option value="${esc(p)}" ${f.person===p?'selected':''}>${esc(p)}</option>`).join('')}
          </select>
        </div>
        <div>
          <label style="font-size:11px;color:var(--muted);">Forma de pagamento (despesas)</label>
          <select class="field-input" id="an-pagamento" onchange="onAnFilterChange()">
            <option value="all">Todas</option>
            <option value="dinheiro" ${f.payment==='dinheiro'?'selected':''}>Dinheiro</option>
            <option value="debito" ${f.payment==='debito'?'selected':''}>Débito</option>
            <option value="pix" ${f.payment==='pix'?'selected':''}>Pix</option>
            ${d.cards.map(c => `<option value="credito:${c.id}" ${f.payment==='credito:'+c.id?'selected':''}>Cartão ${esc(c.name)}</option>`).join('')}
          </select>
        </div>
      </section>

      <div class="dash-grid">
        <div class="dash-col">
          <section>
            <p class="eyebrow">Panorama do período (${nMeses} ${nMeses===1?'mês':'meses'})</p>
            <div class="grid2">
              <div class="card tight">
                <p class="summary-label">Receita total</p>

              </div>
              <div class="card tight">
                <p class="summary-label">Despesa total</p>
                <p class="summary-value font-mono" style="color:var(--rust)">${fmtBRL(totalExpense)}</p>
                <p class="summary-sub">média de ${fmtBRL(totalExpense/nMeses)}/mês</p>
              </div>
            </div>
            <div class="card" style="margin-top:10px;">
              <p class="summary-label">Saldo do período</p>
              <p class="big-value font-mono" style="color:${saldo>=0?'var(--teal)':'var(--rust)'}">${fmtBRL(saldo)}</p>
              <p class="small-note">${poupanca===null ? 'Sem receita no período para calcular taxa de poupança.' : `Taxa de poupança: ${poupanca}% da receita`}</p>
            </div>
            ${topExpenseCat || topIncomeCat ? `
              <div class="grid2" style="margin-top:10px;">
                ${topIncomeCat ? `
                  <div class="card tight">
                    <p class="summary-label">Maior fonte de receita</p>
                    <p style="font-size:14px;font-weight:500;margin:4px 0 0;">${esc(topIncomeCat[0])}</p>
                    <p class="summary-sub font-mono">${fmtBRL(topIncomeCat[1])}</p>
                  </div>
                ` : '<div></div>'}
                ${topExpenseCat ? `
                  <div class="card tight">
                    <p class="summary-label">Maior categoria de despesa</p>
                    <p style="font-size:14px;font-weight:500;margin:4px 0 0;">${esc(topExpenseCat[0])}</p>
                    <p class="summary-sub font-mono">${fmtBRL(topExpenseCat[1])}</p>
                  </div>
                ` : '<div></div>'}
              </div>
            ` : ''}
          </section>
          ${renderBreakdownCard('Composição da receita por categoria', incomeByCategory, totalIncome, 'var(--teal)')}
          ${renderBreakdownCard('Composição da receita por pessoa', incomeByPerson, totalIncome, 'var(--teal)')}
        </div>

        <div class="dash-col">
          ${renderBreakdownCard('Composição da despesa por categoria', expenseByCategory, totalExpense, 'var(--rust)')}
          ${renderBreakdownCard('Composição da despesa por pessoa', expenseByPerson, totalExpense, 'var(--rust)')}
          ${renderBreakdownCard('Composição da despesa por forma de pagamento', expenseByPayment, totalExpense, 'var(--gold)')}
        </div>
      </div>
    </div>
  `;
}

function onAnFilterChange(){
  const f = state.analiseFiltros;
  const newStart = document.getElementById('an-month-start').value || f.monthStart;
  const newEnd = document.getElementById('an-month-end').value || f.monthEnd;
  f.monthStart = newStart;
  f.monthEnd = newEnd < newStart ? newStart : newEnd;
  f.category = document.getElementById('an-categoria').value;
  f.person = document.getElementById('an-pessoa').value;
  f.payment = document.getElementById('an-pagamento').value;
  render();
}
function renderTabBar(){
  const tabs = [
    ['dashboard','&#128176;','Painel'],
    ['lancamentos','&#128203;','Lançamentos'],
    ['nova','&#10133;','Novo'],
    ['cartoes','&#128179;','Cartões'],
    ['analises','&#128202;','Análises']
  ];
  return `
    <nav class="tabbar">
      <div class="inner">
        ${tabs.map(([id,glyph,label]) => `
          <button class="${state.tab===id?'active':''}" data-action="set-tab" data-tab="${id}">
            <span class="glyph">${glyph}</span>
            <span class="lbl">${label}</span>
          </button>
        `).join('')}
      </div>
    </nav>
  `;
}

function renderDeleteRecurringModal(){
  if (!state.deleteRecurringModal) return '';
  const txId = state.deleteRecurringModal.txId;
  return `
    <div class="modal-backdrop" data-action="close-delete-recurring-backdrop">
      <div class="modal-sheet">
        <h2 class="font-display" style="font-size:18px;">Excluir lançamento recorrente</h2>
        <p class="small-note" style="margin-top:6px;">Esse lançamento se repete pelos próximos meses. O que você quer fazer?</p>
        <div style="display:flex;flex-direction:column;gap:8px;margin-top:16px;">
          <button class="primary-btn" style="background:var(--rust);" data-action="confirm-delete-recurring" data-mode="all" data-tx-id="${txId}">Apagar lançamento recorrente</button>
          <button class="primary-btn" style="background:var(--gold);" data-action="confirm-delete-recurring" data-mode="month" data-tx-id="${txId}">Apagar lançamento do mês</button>
          <button class="btn-secondary" data-action="confirm-delete-recurring" data-mode="cancel" data-tx-id="${txId}">Cancelar</button>
        </div>
      </div>
    </div>
  `;
}

function renderSettings(){
  if (!state.settingsOpen) return '';
  const d = state.data;
  return `
    <div class="modal-backdrop" data-action="close-settings-backdrop">
      <div class="modal-sheet">
        <h2 class="font-display">Configurações</h2>
        <p class="small-note">Os dados deste app ficam salvos na sua própria nuvem (Firebase) e são compartilhados entre quem abrir este arquivo — é assim que você e sua esposa veem os mesmos lançamentos em qualquer lugar, em tempo real, sem precisar de conta no Claude.</p>

        <h3>Nomes do casal</h3>
        <div class="field">
          <label>Pessoa 1</label>
          <input class="field-input" id="settings-p1" value="${esc(d.people[0])}">
        </div>
        <div class="field">
          <label>Pessoa 2</label>
          <input class="field-input" id="settings-p2" value="${esc(d.people[1])}">
        </div>

        <h3>Categorias de receita</h3>
        <div class="cat-list">
          ${d.incomeCategories.map(c => `
            <div class="cat-chip"><span>${esc(c)}</span><button data-action="del-cat" data-cat-type="income" data-cat="${esc(c)}" aria-label="Remover categoria" style="color:var(--muted)">&#10005;</button></div>
          `).join('')}
        </div>
        <div class="cat-add-row">
          <input class="field-input" style="margin:0;" id="new-income-cat" placeholder="Nova categoria de receita">
          <button class="btn-secondary" data-action="add-cat" data-cat-type="income">Adicionar</button>
        </div>

        <h3>Categorias de despesa</h3>
        <div class="cat-list">
          ${d.expenseCategories.map(c => `
            <div class="cat-chip"><span>${esc(c)}</span><button data-action="del-cat" data-cat-type="expense" data-cat="${esc(c)}" aria-label="Remover categoria" style="color:var(--muted)">&#10005;</button></div>
          `).join('')}
        </div>
        <div class="cat-add-row">
          <input class="field-input" style="margin:0;" id="new-expense-cat" placeholder="Nova categoria de despesa">
          <button class="btn-secondary" data-action="add-cat" data-cat-type="expense">Adicionar</button>
        </div>

        <h3>Backup</h3>
        <p class="small-note">Exporte um arquivo com todos os dados de vez em quando, como backup — caso algo dê errado com a sincronização.</p>
        <div class="export-row">
          <button class="btn-secondary" data-action="export-data">Exportar (.json)</button>
          <button class="btn-secondary" data-action="import-data">Importar (.json)</button>
        </div>

        <div class="modal-footer">
          <button class="btn-secondary" data-action="close-settings">Fechar</button>
          <button class="btn-primary-sm" data-action="save-settings">Salvar nomes</button>
        </div>
      </div>
    </div>
  `;
}

/* ---------------------------------------------------------------
   Main render
--------------------------------------------------------------- */
function render(){
  if (!FIREBASE_CONFIGURED) {
    document.getElementById('app').innerHTML = `
      <div style="max-width:420px;margin:0 auto;padding:40px 20px;">
        <p class="font-display" style="font-size:20px;">Falta configurar a nuvem</p>
        <p class="small-note" style="margin-top:10px;">
          Abra este arquivo .html em um editor de texto, encontre o bloco <code>firebaseConfig</code> perto do topo,
          e substitua os valores "COLE_AQUI_..." pelos 6 valores do seu projeto Firebase
          (Configurações do projeto → Seus aplicativos → app Web).
        </p>
      </div>
    `;
    return;
  }
  if (!state.loaded) {
    document.getElementById('app').innerHTML = `
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;">
        Carregando dados da nuvem...
      </div>
    `;
    return;
  }

  let body = '';
  if (state.tab === 'dashboard') body = renderDashboard();
  else if (state.tab === 'lancamentos') body = renderLancamentos();
  else if (state.tab === 'nova') body = renderNova();
  else if (state.tab === 'cartoes') body = renderCartoes();
  else if (state.tab === 'analises') body = renderAnalises();

  document.getElementById('app').innerHTML = `
    ${renderHeader()}
    <main>${body}</main>
    ${renderTabBar()}
    ${renderSettings()}
    ${renderDeleteRecurringModal()}
  `;

  if (state.tab === 'nova') {
    const respRow = document.getElementById('nova-responsavel');
    if (respRow) respRow.dataset.selected = respRow.dataset.selected || state.data.people[0];
    if (state.newTxType === 'expense') onPaymentTypeChange();
  }
}

/* ---------------------------------------------------------------
   Actions (event delegation)
--------------------------------------------------------------- */
document.addEventListener('click', function(e){
  const btn = e.target.closest('[data-action]');
  if (!btn) {
    if (e.target.id === 'app' || e.target.closest('.modal-backdrop')) {
      // backdrop click handled by its own data-action
    }
    return;
  }
  const action = btn.dataset.action;

  if (action === 'set-tab') { state.tab = btn.dataset.tab; state.editingTxId = null; return render(); }
  if (action === 'set-filter') { state.filter = btn.dataset.filter; return render(); }
  if (action === 'set-dashboard-filter') {
    state.dashboardFilter = btn.dataset.filter;
    try { localStorage.setItem('painelFiltroPessoa', state.dashboardFilter); } catch (e) { /* ignore */ }
    return render();
  }

  if (action === 'open-settings') { state.settingsOpen = true; return render(); }
  if (action === 'close-settings-backdrop' && e.target !== btn) { /* click landed on modal content, not the dark overlay itself */ }
  else if (action === 'close-settings' || action === 'close-settings-backdrop') { state.settingsOpen = false; return render(); }

  if (action === 'save-settings') {
    const oldP1 = state.data.people[0];
    const oldP2 = state.data.people[1];
    const p1 = document.getElementById('settings-p1').value.trim() || 'Você';
    const p2 = document.getElementById('settings-p2').value.trim() || 'Parceiro(a)';
    state.settingsOpen = false;
    render();
    settingsRef.set({ people: [p1, p2], incomeCategories: state.data.incomeCategories, expenseCategories: state.data.expenseCategories }, { merge: true })
      .catch(markSyncError);
    if (oldP1 !== p1 || oldP2 !== p2) {
      const affected = state.data.transactions.filter(t =>
        (t.person === oldP1 && oldP1 !== p1) || (t.person === oldP2 && oldP2 !== p2)
      );
      const ops = affected.map(t => (batch) => {
        const newPerson = t.person === oldP1 ? p1 : p2;
        batch.update(txRef.doc(t.id), { person: newPerson });
      });
      commitInChunks(ops).catch(markSyncError);
    }
    return;
  }

  if (action === 'add-cat') {
    const type = btn.dataset.catType;
    const inputId = type === 'income' ? 'new-income-cat' : 'new-expense-cat';
    const input = document.getElementById(inputId);
    const val = input.value.trim();
    if (!val) return;
    const key = type === 'income' ? 'incomeCategories' : 'expenseCategories';
    const updated = sortCategories(state.data[key].includes(val) ? state.data[key] : [...state.data[key], val]);
    input.value = '';
    settingsRef.set({ [key]: updated }, { merge: true }).catch(markSyncError);
    return;
  }

  if (action === 'del-cat') {
    const type = btn.dataset.catType;
    const cat = btn.dataset.cat;
    const key = type === 'income' ? 'incomeCategories' : 'expenseCategories';
    if (state.data[key].length <= 1) { alert('Mantenha ao menos uma categoria.'); return; }
    const updated = state.data[key].filter(c => c !== cat);
    settingsRef.set({ [key]: updated }, { merge: true }).catch(markSyncError);
    return;
  }

  if (action === 'export-data') {
    const blob = new Blob([JSON.stringify(state.data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'contas-a-dois-' + currentMonthKey() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    return;
  }

  if (action === 'import-data') {
    document.getElementById('import-file-input').click();
    return;
  }

  if (action === 'select-person') {
    const row = document.getElementById('nova-responsavel');
    row.dataset.selected = btn.dataset.person;
    state.novaDraft.person = btn.dataset.person;
    row.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
    return;
  }

  if (action === 'set-new-type') { captureNovaDraft(); state.newTxType = btn.dataset.type; state.newRepeatMode = 'unica'; return render(); }
  if (action === 'select-repeat') { captureNovaDraft(); state.newRepeatMode = btn.dataset.mode; return render(); }

  if (action === 'submit-nova') {
    const category = document.getElementById('nova-categoria').value;
    const mesRef = document.getElementById('nova-mes').value || currentMonthKey();
    const description = document.getElementById('nova-descricao').value.trim();
    const person = document.getElementById('nova-responsavel').dataset.selected || state.data.people[0];
    const type = state.newTxType;
    const isIncome = type === 'income';
    const repeatMode = isIncome
      ? (document.getElementById('nova-recorrente').checked ? 'recorrente' : 'unica')
      : state.newRepeatMode;

    let paymentType = null, cardId = null;
    if (!isIncome) {
      paymentType = document.getElementById('nova-pagamento').value;
      if (paymentType === 'credito') {
        const cardSel = document.getElementById('nova-cartao-id');
        if (!cardSel) { alert('Cadastre um cartão na aba Cartões primeiro.'); return; }
        cardId = cardSel.value;
      }
    }

    if (!category) { alert('Escolha uma categoria.'); return; }

    const groupId = uid();
    const base = Date.now();
    const newDocs = [];

    if (repeatMode === 'parcelada') {
      const total = Number(document.getElementById('nova-valor-total').value);
      const n = Math.round(Number(document.getElementById('nova-parcelas').value));
      if (isNaN(total) || total <= 0) { alert('Informe o valor total da compra.'); return; }
      if (isNaN(n) || n < 2) { alert('Informe em quantas parcelas foi dividido (2 ou mais).'); return; }
      const amounts = splitInstallments(total, n);
      for (let i = 0; i < n; i++) {
        newDocs.push({
          id: uid(),
          groupId, type, category,
          description: description ? (description + ' · parcela ' + (i+1) + '/' + n) : ('parcela ' + (i+1) + '/' + n),
          amount: amounts[i],
          month: addMonths(mesRef, i),
          recurring: false,
          installment: { index: i + 1, total: n, totalAmount: total },
          person, status: 'pendente', createdAt: base + i, paymentType, cardId
        });
      }
    } else {
      const amount = Number(document.getElementById('nova-valor').value);
      if (isNaN(amount) || amount <= 0) { alert('Preencha um valor válido.'); return; }
      const recurring = repeatMode === 'recorrente';
      const span = recurring ? 12 : 1;
      for (let i = 0; i < span; i++) {
        newDocs.push({
          id: uid(),
          groupId, type, category, description, amount,
          month: addMonths(mesRef, i),
          recurring, person, status: 'pendente', createdAt: base + i,
          paymentType: !isIncome ? paymentType : null,
          cardId: !isIncome ? cardId : null
        });
      }
    }

    state.newRepeatMode = 'unica';
    resetNovaDraft();
    state.tab = 'lancamentos';
    render();
    commitInChunks(newDocs.map(d => (batch) => {
      const data = Object.assign({}, d); delete data.id;
      batch.set(txRef.doc(d.id), data);
    })).catch(markSyncError);
    return;
  }

  if (action === 'edit-amount') { state.editingTxId = btn.dataset.txId; return render(); }
  if (action === 'cancel-edit') { state.editingTxId = null; return render(); }

  if (action === 'save-amount') {
    const txId = btn.dataset.txId;
    const input = document.getElementById('edit-amount-input');
    const newAmount = Number(input.value);
    if (isNaN(newAmount) || newAmount < 0) return;
    const target = state.data.transactions.find(t => t.id === txId);
    if (!target) return;
    const affected = state.data.transactions.filter(t =>
      t.groupId === target.groupId && (t.id === target.id || (t.recurring && t.month > target.month && t.status === 'pendente'))
    );
    state.editingTxId = null;
    render();
    commitInChunks(affected.map(t => (batch) => batch.update(txRef.doc(t.id), { amount: newAmount }))).catch(markSyncError);
    return;
  }

  if (action === 'set-status') {
    const txId = btn.dataset.txId, status = btn.dataset.status;
    txRef.doc(txId).update({ status }).catch(markSyncError);
    return;
  }

  if (action === 'delete-tx') {
    const tx = state.data.transactions.find(t => t.id === btn.dataset.txId);
    if (!tx) return;
    if (tx.recurring) {
      state.deleteRecurringModal = { txId: tx.id };
      return render();
    }
    if (!confirm('Excluir este lançamento?')) return;
    txRef.doc(tx.id).delete().catch(markSyncError);
    return;
  }

  if (action === 'confirm-delete-recurring') {
    const mode = btn.dataset.mode;
    const tx = state.data.transactions.find(t => t.id === btn.dataset.txId);
    state.deleteRecurringModal = null;
    render();
    if (!tx || mode === 'cancel') return;
    if (mode === 'all') {
      const toDelete = state.data.transactions.filter(t =>
        t.groupId === tx.groupId && t.month >= tx.month && (t.id === tx.id || t.status === 'pendente')
      );
      commitInChunks(toDelete.map(t => (batch) => batch.delete(txRef.doc(t.id)))).catch(markSyncError);
    } else if (mode === 'month') {
      txRef.doc(tx.id).delete().catch(markSyncError);
    }
    return;
  }

  if (action === 'close-delete-recurring-backdrop' && e.target === btn) {
    state.deleteRecurringModal = null;
    return render();
  }

  if (action === 'cancel-installments') {
    const tx = state.data.transactions.find(t => t.id === btn.dataset.txId);
    if (!tx) return;
    if (!confirm('Isso remove as parcelas futuras ainda pendentes desta compra. Continuar?')) return;
    const toDelete = state.data.transactions.filter(t =>
      t.groupId === tx.groupId && t.installment && t.status === 'pendente' && t.month >= tx.month
    );
    commitInChunks(toDelete.map(t => (batch) => batch.delete(txRef.doc(t.id)))).catch(markSyncError);
    return;
  }

  if (action === 'add-card') {
    const input = document.getElementById('novo-cartao-nome');
    const name = input.value.trim();
    if (!name) return;
    input.value = '';
    cardsRef.doc(uid()).set({ name }).catch(markSyncError);
    return;
  }

  if (action === 'remove-card') {
    cardsRef.doc(btn.dataset.cardId).delete().catch(markSyncError);
    return;
  }

  if (action === 'confirmar-fatura') {
    const cardId = btn.dataset.cardId;
    const mes = state.cartoesMonth || currentMonthKey();
    const toUpdate = state.data.transactions.filter(t => t.cardId === cardId && t.month === mes && t.status === 'pendente');
    commitInChunks(toUpdate.map(t => (batch) => batch.update(txRef.doc(t.id), { status: 'pago' }))).catch(markSyncError);
    return;
  }
});

document.getElementById('import-file-input').addEventListener('change', function(e){
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async function(){
    try {
      const parsed = JSON.parse(reader.result);
      if (!parsed || !Array.isArray(parsed.transactions)) throw new Error('formato inválido');
      if (!confirm('Isso vai substituir os dados atuais na nuvem pelos do arquivo importado, para todo mundo que acessa este app. Continuar?')) return;

      const dd = defaultData();
      const people = parsed.people || dd.people;
      const incomeCategories = sortCategories(parsed.incomeCategories || dd.incomeCategories);
      const expenseCategories = sortCategories(parsed.expenseCategories || dd.expenseCategories);
      const cards = Array.isArray(parsed.cards) ? parsed.cards : [];
      const transactions = parsed.transactions;

      const oldCardIds = state.data.cards.map(c => c.id);
      const oldTxIds = state.data.transactions.map(t => t.id);

      const ops = [];
      ops.push((batch) => batch.set(settingsRef, { people, incomeCategories, expenseCategories }, { merge: true }));
      oldCardIds.forEach(id => ops.push((batch) => batch.delete(cardsRef.doc(id))));
      oldTxIds.forEach(id => ops.push((batch) => batch.delete(txRef.doc(id))));
      cards.forEach(c => {
        const id = c.id || uid();
        const data = Object.assign({}, c); delete data.id;
        ops.push((batch) => batch.set(cardsRef.doc(id), data));
      });
      transactions.forEach(t => {
        const id = t.id || uid();
        const data = Object.assign({}, t); delete data.id;
        ops.push((batch) => batch.set(txRef.doc(id), data));
      });

      await commitInChunks(ops);
    } catch (err) {
      console.error(err);
      alert('Não foi possível importar este arquivo. Verifique se é um export válido do Contas a Dois.');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

render();
if (FIREBASE_CONFIGURED) {
  initFirebase();
  attachRealtimeListeners();
}
</script>
